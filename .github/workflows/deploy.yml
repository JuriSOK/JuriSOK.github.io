name: Deploy to GitHub Pages

# The repository is `JuriSOK.github.io`, so the site is served from the domain
# root: no basePath. Next.js builds a fully static site into `out/`
# (`output: 'export'` in next.config.ts).
#
# `npm run sync:projects` is deliberately NOT run here: it calls the GitHub API
# and rewrites a committed file. Refresh it locally, then push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint, types and build gate the deployment: a broken commit never
      # reaches the live site.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # After the build: it generates next-env.d.ts, which types image imports.
      - name: Type check
        run: npx tsc --noEmit

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
